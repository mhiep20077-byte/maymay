# ============================================================
# Spotify Premium & AdBlock Configuration
# Hỗ trợ: Shadowrocket, Loon, Quantumult X, Surge
# Tác giả: @duyvinh09
# ============================================================

[General]

[Header Rewrite]
http-request ^https:\/\/(?:spclient\.wg\.spotify\.com|[\w-]+-spclient\.spotify\.com)(?::443)?\/user-customization-service\/v1\/customize header-del if-none-match

[Script]
# 1. Chuyển đổi giao diện iPad để mở khóa tính năng
spotify-json = type=http-request,pattern=^https:\/\/(?:spclient\.wg\.spotify\.com|[\w-]+-spclient\.spotify\.com)(?::443)?\/(?:artistview|album-entity-view)\/,requires-body=0,script-path=https://raw.githubusercontent.com/mhiep20077-byte/maymay/main/Spotify/js/spotify-json.js,script-update-interval=0

# 2. Xử lý request, chặn quảng cáo và cấp device capabilities Premium
spotify-request = type=http-request,pattern=^https?:\/\/(?:(?:spclient\.wg\.spotify\.com|[\w-]+-spclient\.spotify\.com)(?::443)?\/(?:device-capabilities\/v1\/capabilities|reachability\/check|ads(?:\/|$)|ad-logic(?:\/|$)|pendragon(?:\/|$)|speechless(?:\/|$)|track-error\/v1\/errors|[^?#]*recommendations-in-free-tier-playlist)|apresolve\.spotify\.com(?::443)?\/resolve|(?:[\w-]+\.)*akamaized\.net(?::443)?\/),requires-body=0,script-path=https://raw.githubusercontent.com/mhiep20077-byte/maymay/main/Spotify/js/spotify-request.js,script-update-interval=0

# 3. Kích hoạt thuộc tính tài khoản Premium
spotify-state = type=http-response,pattern=^https:\/\/(?:spclient\.wg\.spotify\.com|[\w-]+-spclient\.spotify\.com)(?::443)?\/(?:melody\/v1\/check_product_state|user-attributes\/|product-state\/v1\/values),requires-body=1,max-size=0,script-path=https://raw.githubusercontent.com/mhiep20077-byte/maymay/main/Spotify/js/spotify-state.js,script-update-interval=0

# 4. Giải mã Protobuf, hiển thị huy hiệu và kích hoạt dịch vụ
spotify-proto = type=http-response,pattern=^https:\/\/(?:spclient\.wg\.spotify\.com|[\w-]+-spclient\.spotify\.com)(?::443)?\/(?:bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize|pam-view-service\/|nebula\/v1\/attributes|configuration\/attributes),requires-body=1,binary-body-mode=1,max-size=0,script-path=https://raw.githubusercontent.com/mhiep20077-byte/maymay/main/Spotify/js/spotify-proto.js,script-update-interval=0

[MITM]
hostname = %APPEND% apresolve.spotify.com, *.akamaized.net, spclient.wg.spotify.com, *-spclient.spotify.com, *spclient.spotify.com
